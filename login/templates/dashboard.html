<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- font awesome from BootstrapCDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
            integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.3/css/fontawesome.min.css"
            integrity="sha384-wESLQ85D6gbsF459vf1CiZ2+rr+CsxRY0RpiF1tLlQpDnAgg6rwdsUF1+Ics2bni" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.3/css/solid.min.css"
            crossorigin="anonymous">
        <link href="/public/app.css" rel="stylesheet">
    </head>
    <body class="home">
        <div class="home-container">
            <div class="glass-panel login-box">
                <img class="avatar rounded-circle mb-3" style="width: 100px; height: 100px; object-fit: cover; border: 3px solid var(--primary-color);" src="{{userinfo['picture']}}"/>
                <h2>Welcome {{userinfo['name']}}</h2>
                <div class="text-left bg-dark p-3 rounded my-4" style="overflow-x: auto;">
                    <pre class="text-light m-0" style="font-size: 0.8rem;">{{userinfo_pretty}}</pre>
                </div>
                <a id="qsLogoutBtn" class="btn btn-info btn-lg btn-block mt-4" href="/logout">Logout</a>
                <a id="qsHomeBtn" class="btn btn-primary btn-lg btn-block mt-2" href="/contents">Go to Tasks</a>
            </div>
        </div>
    </body>
</html>
