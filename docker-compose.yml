services:
  crawla_web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ".:/work"
    networks:
      - crw
    restart: always
    container_name: crawla_web
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: ${APP_PORT:-3000}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CALLBACK_URL: ${AUTH0_CALLBACK_URL:-}
      AUTH0_LOGOUT_REDIRECT_URL: ${AUTH0_LOGOUT_REDIRECT_URL:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    depends_on:
      - redis
      - chrome
      - mongo

  chrome:
    image: "selenium/standalone-chrome:131.0"
    ports:
      - "4444:4444"
    networks:
      - crw
    restart: always
    container_name: crawla_chrome
    shm_size: '2gb'
    environment:
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    networks:
      - crw
    restart: always
    container_name: crawla_redis
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-lru

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    networks:
      - crw
    restart: always
    container_name: crawla_mongo
    volumes:
      - mongo_data:/data/db

networks:
  crw:
    driver: bridge

volumes:
  mongo_data:
